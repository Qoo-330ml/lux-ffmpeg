# 已知在 8.1.3 里不存在的白名单候选:`trim` bsf(见 allowlist.md「版本差异」)。
LUX_DEMUXERS="matroska mov mpegts aac ac3 aiff amr ape asf ass av1 avi caf concat dv eac3 flac flv h264 hevc hls ivr kux live_flv loas m4v mp3 mpegps mpegtsraw mpegvideo ogg rm rtp rtsp sdp srt vc1 wav webm_dash_manifest webvtt"
LUX_MUXERS="mov mp4"
LUX_PARSERS="h264 hevc aac ac3 opus vorbis aac_latm adx amr apv av1 avs2 avs3 bmp cavsvideo cook cri dca dirac dnxhd dnxuc dolby_e dpx dvaudio dvbsub dvdsub evc ffv1 flac ftr g723_1 g729 gif gsm h261 h263 hdr ipu jpeg2000 jpegxl jpegxs lcevc misc4 mjpeg mlp mpeg4video mpegaudio mpegvideo png pnm prores prores_raw qoi rv34 sbc sipr tak vc1 vp3 vp8 vp9 vvc webp xbm xma xwd"
LUX_DECODERS="h264 hevc aac ac3 eac3 dca truehd mlp flac opus vorbis pgssub subrip ass webvtt webp mjpeg aac_at aac_fixed aac_latm ac3_at ac3_fixed adpcm_4xm adpcm_adx adpcm_afc adpcm_agm adpcm_aica adpcm_argo adpcm_ct adpcm_dtk adpcm_ea adpcm_ea_maxis_xa adpcm_ea_r1 adpcm_ea_r2 adpcm_ea_r3 adpcm_ea_xas adpcm_g722 adpcm_g726 adpcm_g726le adpcm_ima_acorn adpcm_ima_alp adpcm_ima_amv adpcm_ima_apc adpcm_ima_apm adpcm_ima_cunning adpcm_ima_dat4 adpcm_ima_dk3 adpcm_ima_dk4 adpcm_ima_ea_eacs adpcm_ima_ea_sead adpcm_ima_iss adpcm_ima_moflex adpcm_ima_mtf adpcm_ima_oki adpcm_ima_qt adpcm_ima_qt_at adpcm_ima_rad adpcm_ima_smjpeg adpcm_ima_ssi adpcm_ima_wav adpcm_ima_ws adpcm_ima_xbox adpcm_ms adpcm_mtaf adpcm_psx adpcm_sanyo adpcm_sbpro_2 adpcm_sbpro_3 adpcm_sbpro_4 adpcm_swf adpcm_thp adpcm_thp_le adpcm_vima adpcm_xa adpcm_xmd adpcm_yamaha adpcm_zork alac alac_at amr_nb_at amrnb amrwb ape av1 ccaption cook dolby_e dvbsub dvdsub dxv eac3_at ffv1 ffvhuff flv gsm_ms_at h263 h263i h263p hap huffyuv ilbc_at indeo5 ipu media100 mjpegb movtext mp1 mp1_at mp1float mp2 mp2_at mp2float mp3 mp3_at mp3adu mp3adufloat mp3float mp3on4 mp3on4float mpeg1video mpeg2video mpeg4 mpegvideo mpl2 msmpeg4v1 msmpeg4v2 msmpeg4v3 mts2 pcm_alaw pcm_alaw_at pcm_bluray pcm_dvd pcm_f16le pcm_f24le pcm_f32be pcm_f32le pcm_f64be pcm_f64le pcm_lxf pcm_mulaw pcm_mulaw_at pcm_s16be pcm_s16be_planar pcm_s16le pcm_s16le_planar pcm_s24be pcm_s24daud pcm_s24le pcm_s24le_planar pcm_s32be pcm_s32le pcm_s32le_planar pcm_s64be pcm_s64le pcm_s8 pcm_s8_planar pcm_sga pcm_u16be pcm_u16le pcm_u24be pcm_u24le pcm_u32be pcm_u32le pcm_u8 pcm_vidc prores qdm2_at qdmc_at rv10 rv20 rv30 rv40 snow sonic srt ssa svq3 tta txd vc1 vp6 vp6a vp6f vp7 vp8 vp9 wmalossless wmapro wmav1 wmav2 wmavoice wmv1 wmv2 wmv3 xma1 xma2 xsub"
LUX_ENCODERS="aac aac_at"
LUX_BSFS="hevc_mp4toannexb h264_mp4toannexb aac_adtstoasc dca_core dovi_rpu extract_extradata null apv_metadata av1_frame_merge av1_frame_split av1_metadata chomp dts2pts dump_extradata dv_error_marker eac3_core eia608_to_smpte436m evc_frame_merge filter_units h264_metadata h264_redundant_pps hapqa_extract hevc_metadata imx_dump_header lcevc_metadata media100_to_mjpegb mjpeg2jpeg mjpega_dump_header mov2textsub mpeg2_metadata mpeg4_unpack_bframes noise opus_metadata pcm_rechunk pgs_frame_merge prores_metadata remove_extradata setts showinfo smpte436m_to_eia608 text2movsub trace_headers truehd_core vp9_metadata vp9_raw_reorder vp9_superframe vp9_superframe_split vvc_metadata vvc_mp4toannexb"
# F2-1:libmpv 播放远程地址需要网络协议;TLS 走 securetransport(系统信任根,无第三方库)。
# 理由见 allowlist.md「F2-1 网络与 TLS」。
LUX_PROTOCOLS="file http https tcp tls async cache concat concatf crypto data fd ffrtmphttp ftp gopher gophers httpproxy icecast ipfs_gateway ipns_gateway md5 mmsh mmst pipe prompeg rtmp rtmps rtmpt rtmpts rtp srtp subfile tee udp udplite unix"
# F0 附加项(超出任务书白名单,理由见 allowlist.md「附加项」):只开解码 hwaccel,
# 不开编码 hwaccel。h264/hevc 的 VideoToolbox 硬解是 libmpv 的底层能力。
LUX_HWACCELS="h264_videotoolbox hevc_videotoolbox"
# F2:VT/CoreImage 滤镜 + 组图必需的基础滤镜(每一项都要在 allowlist.md 里有理由)
# 注意:buffersrc/buffersink 是 libavfilter 的核心(无 CONFIG_*_FILTER 开关),不用列。
# P1 第 5 步:补 mpv 需要的原生滤镜,逐项理由见 allowlist.md「滤镜(P1 第5步)」。
#   音频 af(13):aformat amix anull aresample areverse asetrate atempo atrim
#                equalizer firequalizer pan superequalizer volume
#   视频 vf(25):bwdif estdif fps hflip hwmap idet lenscorrection lut lut1d lut2 lut3d
#                lutrgb lutyuv negate overlay palettegen paletteuse rotate scale2ref
#                setpts transpose trim vflip w3fdif yadif
# 需要外部库/GPU 工具链的滤镜(ass/subtitles/libplacebo/*_vulkan)不在此列,见 allowlist.md。
LUX_FILTERS="scale_vt transpose_vt format scale null hwupload hwdownload aformat amix anull aresample areverse asetrate atempo atrim equalizer firequalizer pan superequalizer volume bwdif estdif fps hflip hwmap idet lenscorrection lut lut1d lut2 lut3d lutrgb lutyuv negate overlay palettegen paletteuse rotate scale2ref setpts transpose trim vflip w3fdif yadif"
# Metal 滤镜:需要 Metal Toolchain;toolchain 不在时 configure 会静默关掉,靠 verify 抓
LUX_FILTERS_METAL="tonemap_videotoolbox overlay_videotoolbox bwdif_videotoolbox yadif_videotoolbox"

# 产物里必须存在的静态库(F0 只有这几个;C/链接顺序也按这个顺序)
LUX_STATIC_LIBS="libavformat.a libavcodec.a libavfilter.a libswscale.a libswresample.a libavutil.a"

# ---------------------------------------------------------------------------
# 目标相关的环境(SDK / 最低系统版本 / 编译器)。只设变量,不产生 configure 参数。
# ---------------------------------------------------------------------------
ff_target_setup() {
    FF_TARGET="$1"
    FF_CROSS=no
    case "$FF_TARGET" in
        macos-arm64)
            FF_SDK_NAME=macosx
            FF_MIN_FLAG="-mmacosx-version-min=14.0"
            FF_HOST_OS_LABEL="macOS 14.0"
            ;;
        ios-arm64)
            FF_SDK_NAME=iphoneos
            FF_MIN_FLAG="-miphoneos-version-min=17.0"
            FF_HOST_OS_LABEL="iOS 17.0"
            FF_CROSS=yes
            ;;
        ios-sim-arm64)
            FF_SDK_NAME=iphonesimulator
            FF_MIN_FLAG="-mios-simulator-version-min=17.0"
            FF_HOST_OS_LABEL="iOS simulator 17.0"
            FF_CROSS=yes
            ;;
        *)
            return 1
            ;;
    esac
    FF_SDK_PATH=$(xcrun --sdk "$FF_SDK_NAME" --show-sdk-path) || return 1
    FF_SDK_VERSION=$(xcrun --sdk "$FF_SDK_NAME" --show-sdk-version) || return 1
    # Metal 滤镜要 Metal Toolchain(Xcode 26 起是可选组件)。没有就关掉,构建仍然可复现;
    # verify-license.sh 会在 CONFIG_METAL=1 时要求 3 个 Metal 滤镜确实启用。
    if xcrun --sdk "$FF_SDK_NAME" metal --version >/dev/null 2>&1; then
        FF_METAL=yes
        FF_METAL_CC="xcrun --sdk $FF_SDK_NAME metal"
        FF_METAL_LIB="xcrun --sdk $FF_SDK_NAME metallib"
    else
        FF_METAL=no
    fi
    FF_CC="xcrun --sdk $FF_SDK_NAME clang"
}

# ---------------------------------------------------------------------------
# configure 参数(数组,按目标生成)
# ---------------------------------------------------------------------------
# $1 = target, $2 = 安装前缀(make install 的落点,由 build 脚本传入 lux/.build/<target>/install)
ff_configure_opts() {
    local target=$1 prefix=${2:-}
    ff_target_setup "$target" || return 1

    local cflags ldflags
    cflags="-arch arm64 $FF_MIN_FLAG -isysroot $FF_SDK_PATH"
    ldflags="-arch arm64 $FF_MIN_FLAG -isysroot $FF_SDK_PATH"

    FF_OPTS=(
        # ---- 许可:只有 LGPL。任何 --enable-gpl/--enable-nonfree 都禁止 ----
        --disable-gpl
        --disable-nonfree
        # 不加 --enable-version3:许可为 LGPL-2.1+(D2,2026-11-10 所有者确认)。P0-4 证明去掉它后组件集不变;
        # 只有 gmp/mbedtls/liblensfun/opencore-amr 等 version3 外部库或 OpenSSL>=3 才会强制要求它,本构建都不用。

        # ---- 库形态:静态库 .a,PIC,不出 program/doc ----
        --enable-static
        --disable-shared
        --enable-pic
        --disable-programs
        --disable-doc
        --disable-debug
        --disable-stripping

        # ---- 平台 ----
        --target-os=darwin
        --arch=arm64
        --cc="$FF_CC"
        --extra-cflags="$cflags"
        --extra-ldflags="$ldflags"

        # ---- 从零开始,只按白名单打开 ----
        --disable-everything
        # F2-1:网络协议与 TLS(securetransport)。见 allowlist.md「F2-1 网络与 TLS」。
        --enable-network
        --enable-securetransport

        # ---- 不用的库/子系统 ----
        --disable-avdevice
        # F2 第一块:avfilter/swscale 进来(VT/CoreImage 滤镜要用)。GPL 滤镜靠
        # --disable-gpl + 白名单 + verify-license 的源审计挡住。
        --enable-avfilter
        --enable-swscale
        # libpostproc 在 FFmpeg 8.0 已被移除,所以没有 --disable-postproc 这个选项
        # (8.1.3 的 configure 对未知选项直接报错,见 allowlist.md「版本差异」)。

        # ---- aarch64 CRC 硬件指令:上游 libavutil/aarch64/crc.S 是 GPL ----
        # 关掉这个 CPU 扩展后,libavutil 走 libavutil/crc.c 的 C 实现,配合
        # lux 的 Makefile 守卫,这个 GPL 源文件在 LGPL 构建里不会被编译。
        --disable-arm-crc

        # ---- 不探测任何外部库,避免 homebrew / 系统库污染 ----
        --disable-autodetect
        --disable-zlib
        --disable-bzlib
        --disable-lzma
        --disable-iconv
        --disable-xlib
        --disable-sdl2
        --disable-appkit
        --disable-avfoundation
        --enable-coreimage
        --disable-vulkan

        # ---- Apple 专有音频/视频框架 ----
        --enable-audiotoolbox
        --enable-videotoolbox
    )

    if [ -n "$prefix" ]; then FF_OPTS+=(--prefix="$prefix"); fi

    if [ "$FF_CROSS" = yes ]; then
        FF_OPTS+=(--enable-cross-compile)
    fi

    local v
    for v in $LUX_DEMUXERS;   do FF_OPTS+=("--enable-demuxer=$v");  done
    for v in $LUX_MUXERS;     do FF_OPTS+=("--enable-muxer=$v");    done
    for v in $LUX_PARSERS;    do FF_OPTS+=("--enable-parser=$v");   done
    for v in $LUX_DECODERS;   do FF_OPTS+=("--enable-decoder=$v");  done
    for v in $LUX_ENCODERS;   do FF_OPTS+=("--enable-encoder=$v");  done
    for v in $LUX_BSFS;       do FF_OPTS+=("--enable-bsf=$v");      done
    for v in $LUX_PROTOCOLS;  do FF_OPTS+=("--enable-protocol=$v"); done
    for v in $LUX_HWACCELS;   do FF_OPTS+=("--enable-hwaccel=$v");  done
    for v in $LUX_FILTERS;    do FF_OPTS+=("--enable-filter=$v");   done

    if [ "$FF_METAL" = yes ]; then
        FF_OPTS+=("--enable-metal" "--metalcc=$FF_METAL_CC" "--metallib=$FF_METAL_LIB")
        for v in $LUX_FILTERS_METAL; do FF_OPTS+=("--enable-filter=$v"); done
    else
        FF_OPTS+=("--disable-metal")
    fi

    return 0
}

# 白名单总数(verify-license.sh 用来对账)
ff_whitelist_summary() {
    printf 'demuxer:%s\n' "$LUX_DEMUXERS"
    printf 'muxer:%s\n'   "$LUX_MUXERS"
    printf 'parser:%s\n'  "$LUX_PARSERS"
    printf 'decoder:%s\n' "$LUX_DECODERS"
    printf 'encoder:%s\n' "$LUX_ENCODERS"
    printf 'bsf:%s\n'     "$LUX_BSFS"
    printf 'protocol:%s\n' "$LUX_PROTOCOLS"
    printf 'hwaccel:%s\n' "$LUX_HWACCELS"
    printf 'filter:%s\n'  "$LUX_FILTERS"
}

# 禁止出现在 configure 参数里的字符串(构建前自检 + verify-license.sh 复用)
LUX_FORBIDDEN_OPTS='--enable-gpl|--enable-nonfree|--enable-libx264|--enable-libx265|--enable-libfdk|--enable-libxvid|--enable-libvidstab|--enable-x264|--enable-libvpx|--enable-libtheora|--enable-libdav1d|--enable-libass|--enable-libfreetype|--enable-postproc|--enable-libmp3lame'

# ---------------------------------------------------------------------------
# F1:动态 framework / xcframework
# ---------------------------------------------------------------------------
# 交付顺序 = 链接依赖顺序(avutil ← swresample/avcodec ← avformat)。
# 每个 framework 的模块名 = FFmpeg 库名首字母大写,与 MPVKit / A0 的
# `import Libavformat` 兼容。
LUX_FRAMEWORKS="Libavutil Libswresample Libavcodec Libswscale Libavfilter Libavformat"
LUX_BUNDLE_ID_PREFIX="dev.lux.ffmpeg"

# 动态库要保留 DWARF 才能 dsymutil 出 dSYM:F0 的 configure 带 --disable-debug,
# 这里在 extra-cflags 里补 -g(不打开 FFmpeg 的 --enable-debug,避免 DEBUG 行为差异)。
LUX_FRAMEWORK_CFLAGS="-g"
# install_name_tool 之后要能改出更长的 @rpath/... 名字,所以给 load command 留头部空间。
LUX_FRAMEWORK_LDFLAGS="-Wl,-headerpad_max_install_names"
# 每个库的 FFmpeg 版本号从 install 头文件里读(CFBundleVersion 用),见 ff_lib_version。
ff_lib_framework() { # $1 = lib dir (libavformat) -> framework 名
    case "$1" in
        libavutil)      echo Libavutil ;;
        libswresample)  echo Libswresample ;;
        libavcodec)     echo Libavcodec ;;
        libswscale)     echo Libswscale ;;
        libavfilter)    echo Libavfilter ;;
        libavformat)    echo Libavformat ;;
        *) return 1 ;;
    esac
}

ff_lib_from_framework() { # $1 = framework 名 -> lib dir
    case "$1" in
        Libavutil)      echo libavutil ;;
        Libswresample)  echo libswresample ;;
        Libavcodec)     echo libavcodec ;;
        Libswscale)     echo libswscale ;;
        Libavfilter)    echo libavfilter ;;
        Libavformat)    echo libavformat ;;
        *) return 1 ;;
    esac
}

# 直接依赖(用于 otool -L 对账与 module map 的 use/link)
ff_framework_deps() { # $1 = framework 名 -> 依赖的 framework 名(空格分隔)
    case "$1" in
        Libavutil)      echo "" ;;
        Libswresample)  echo "Libavutil" ;;
        Libavcodec)     echo "Libavutil Libswresample" ;;
        Libswscale)     echo "Libavutil" ;;
        Libavfilter)    echo "Libswscale Libavutil" ;;
        Libavformat)    echo "Libavcodec Libavutil Libswresample" ;;
        *) return 1 ;;
    esac
}

# 版本号(FFmpeg 8.1.3 实测,从 install/include 的 version.h 读取,读不到时返回空)
ff_lib_version() { # $1 = install prefix, $2 = lib dir
    local inc="$1/include/$2/version.h"
    local major_inc="$1/include/$2/version_major.h"
    local files=()
    [ -f "$inc" ] || return 1
    files+=("$inc")
    [ -f "$major_inc" ] && files+=("$major_inc")
    awk '
        /#define LIB[A-Z]+_VERSION_MAJOR/ { major = $3 }
        /#define LIB[A-Z]+_VERSION_MINOR/ { minor = $3 }
        /#define LIB[A-Z]+_VERSION_MICRO/ { micro = $3 }
        END { if (major != "") printf "%s.%s.%s\n", major, minor, micro; else exit 1 }
    ' "${files[@]}"
}

# 动态构建的 configure 参数:在 F0 的静态配置上翻转库形态,并补 DWARF / header pad。
# 用法:ff_framework_configure_opts <target> <install-prefix>
ff_framework_configure_opts() {
    local target=$1 prefix=${2:-}
    ff_configure_opts "$target" "$prefix" || return 1

    local out=() opt
    for opt in "${FF_OPTS[@]}"; do
        case "$opt" in
            --enable-static|--disable-shared)
                ;;
            --extra-cflags=*)
                out+=("--extra-cflags=${opt#--extra-cflags=} $LUX_FRAMEWORK_CFLAGS")
                ;;
            --extra-ldflags=*)
                out+=("--extra-ldflags=${opt#--extra-ldflags=} $LUX_FRAMEWORK_LDFLAGS")
                ;;
            *)
                out+=("$opt")
                ;;
        esac
    done
    # 动态库:install name 直接写成 @rpath/lib<name>.<major>.dylib,打包时再改成
    # @rpath/<Name>.framework/<Name>(这样中间产物里也没有绝对路径)。
    out+=(--enable-shared --disable-static --install-name-dir=@rpath)
    FF_OPTS=("${out[@]}")
    return 0
}
