# lux-ffmpeg — F0 minimal LGPL configure configuration.
#
# 这个文件是 configure 参数的「唯一真相」:lux/build/build-ffmpeg.sh 只 source 它,
# 不允许在脚本里另加 configure 参数。要改白名单/许可/目标,只改这里。
#
# 三个目标:
#   macos-arm64     本机 (arm64 macOS) 原生构建,用于在本机真跑验证
#   ios-arm64       iOS device (iphoneos SDK, arm64, min 17.0)
#   ios-sim-arm64   iOS simulator (iphonesimulator SDK, arm64, min 17.0)
#
# 基线:jellyfin-ffmpeg v8.1.3-2 (FFmpeg 8.1.3 + jellyfin 补丁),源码树 LGPL/GPL 混合,
# 本配置只启用 LGPL 部分(见 lux/config/allowlist.md 与 lux/README.md)。

LUX_BASELINE_LABEL="jellyfin-ffmpeg v8.1.3-2 (FFmpeg 8.1.3)"
LUX_TARGETS="macos-arm64 ios-arm64 ios-sim-arm64"

# ---------------------------------------------------------------------------
